[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "FlintNDE"
version = "1.0"
description = "High-precision local-series transport for matrix differential equations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-flint>=0.6",
    "sympy>=1.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flintnde*"]
